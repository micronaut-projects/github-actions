name: Pre-build steps for graalvm workflow
description: Runs pre-build steps for graalvm workflow
inputs:
  distribution:
    description: 'GraalVM distribution (graalvm, graalvm-community, or mandrel)'
    required: false
  java:
    description: 'Java version'
    required: true
  gradle-java:
    description: 'Java version for running Gradle'
    required: false
    default: '21'
  nativeTestTask:
    description: 'Native test task that will be executed'
    required: false
    default: ''
  develocity-access-key:
    description: 'Develocity access key (host=key). setup-gradle exchanges it for a short-lived token that later steps receive as DEVELOCITY_ACCESS_KEY. When empty, setup-gradle uses a DEVELOCITY_ACCESS_KEY environment variable instead.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # https://github.com/actions/virtual-environments/issues/709
    - name: "Free disk space"
      shell: bash
      run: |
        sudo -n rm -rf "/usr/local/share/boost" || true
        sudo -n rm -rf "$AGENT_TOOLSDIRECTORY" || true
        sudo -n apt-get clean || true
        df -h

    - name: "Checkout repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: "Set up $JAVA_HOME for Gradle"
      uses: actions/setup-java@v4.2.0
      with:
        distribution: 'oracle'
        java-version: ${{ inputs.gradle-java }}

    - name: "Set up $GRAALVM_HOME for Native Build Tools"
      uses: graalvm/setup-graalvm@v1.4.5
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java }}
        set-java-home: 'false'
        native-image-job-reports: true

    - name: "Set up Gradle"
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        develocity-access-key: ${{ inputs.develocity-access-key }}

    # setup-gradle also exports the token as GRADLE_ENTERPRISE_ACCESS_KEY, which micronaut-build 8.0 treats as a CI
    # build that writes to the remote build cache. Only pushes to release and default branches build merged code;
    # every other event (pull requests, merge queues, workflow_run, schedules, manual runs) only reads from the cache.
    # This sets the default for later steps; a step that sets ORG_GRADLE_PROJECT_cachePush itself still wins.
    - name: "Restrict remote build cache writes to trusted pushes"
      shell: bash
      run: |
        trusted_ref='^refs/heads/(master|main|[0-9]+\.[0-9]+\.x)$'
        if [[ "$GITHUB_EVENT_NAME" != "push" || ! "$GITHUB_REF" =~ $trusted_ref ]]; then
          echo "ORG_GRADLE_PROJECT_cachePush=false" >> "$GITHUB_ENV"
        fi

    - name: "Optional setup step"
      shell: bash
      run: |
        [ -f ./setup.sh ] && ./setup.sh ${{ inputs.nativeTestTask }} || [ ! -f ./setup.sh ]
